# Application name
spring.application.name=bird-ucc-backend

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=your-secret-key-here-make-it-long-and-secure-in-production
jwt.expiration=86400000

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:development-token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:development-bot}

# Server Configuration
server.port=3000

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Telegram API Configuration
telegram.api.id=${TELEGRAM_API_ID:22768079}
telegram.api.hash=${TELEGRAM_API_HASH:a686b8b2577b739fa0d025ad4ed72813}
