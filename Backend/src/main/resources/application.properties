# Application name
spring.application.name=bird-ucc-backend

# Database Configuration
spring.datasource.url=jdbc:h2:mem:birduccdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=your-secret-key-here-make-it-long-and-secure-in-production
jwt.expiration=86400000

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:development-token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:development-bot}

# Server Configuration
server.port=8080
